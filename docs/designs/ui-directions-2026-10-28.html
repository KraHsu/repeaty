        /* 动效：咔嗒用于控件，滑行用于画面与切换，弹出用于确认；弹簧曲线由刚度/阻尼采样 */
        --snap: cubic-bezier(0.2, 0.9, 0.25, 1.04);
        --snap-d: 330ms;
        --glide: cubic-bezier(0.2, 0.8, 0.2, 1);

        --exit: cubic-bezier(0.4, 0, 1, 1);

          --pop: linear(

            0.087,
            0.289,
            0.533,
            0.765,
            0.954,
            1.084,
            1.156,
            1.176,
            1.161,

            0.986,
            0.973,

            0.977,

            0.998,
            1.002,
            1.005,
            1.005,
            1.005,
            1
          );

      * {

      .name {

      .frame {
        position: relative;
        background: var(--surface);
        border-radius: 4px;
        box-shadow:
          0 0 0 1px #00000014,
          0 24px 48px -30px #00000040;
        transition:
          box-shadow 0.25s,
          transform 0.45s var(--glide);
      }
      .frame:hover {
        box-shadow:
          0 0 0 1px #0000002e,
          0 36px 64px -30px #00000052;
        transform: translateY(-3px);
      }
      .frame:active {
        transform: translateY(-1px) scale(0.995);
        transition-duration: 0.25s, 0.12s;
      }
      .frame[data-viewport='mobile'] {
        padding: 20px 0;
        background: var(--well);
      }
      .peek {
        position: absolute;
        inset: auto 0 0 0;
        z-index: 2;
        padding: 10px 12px;
        font-size: 12.5px;
        color: #fff;
        background: linear-gradient(transparent, #000b);
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.18s,
          transform 0.3s var(--glide);
        pointer-events: none;
        border-radius: 0 0 4px 4px;
      }
      .frame:hover .peek,
      .hit:focus-visible ~ .peek {
        opacity: 1;
        transform: none;
      }
      .stage {
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        border-radius: 3px;
        background: #ebebeb;

      .stage iframe,
      .stage img {
        position: absolute;
        left: 0;

        opacity: 0;
        transition: opacity 0.4s ease-out;
      }
      .stage.ready iframe,

      .stage img {

      .stage.offline .static {

      .nav {

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 40;
        display: flex;
        align-items: center;

        box-shadow: 0 18px 44px -10px #00000066;

          opacity 0.16s var(--exit),
          transform 0.2s var(--exit);

          opacity 0.18s ease-out,
          transform var(--snap-d) var(--snap);

      .toast .tick {
        flex: none;

        height: 22px;
        border-radius: 50%;
        background: var(--hl);
        display: grid;
        place-items: center;
      }
      .toast .tick::before {
        content: '';
        width: 8px;
        height: 4px;
        margin-top: -2px;
        border-left: 1.6px solid var(--ink);
        border-bottom: 1.6px solid var(--ink);
        transform: rotate(-45deg);

      .toast[data-fail] .tick {
        background: #c2462e;
      }
      .toast[data-fail] .tick::before {
        width: 2px;
        height: 9px;
        margin: 0;
        border: 0;
        background: #fff;
        transform: none;
      }
      .toast b {
        font-weight: 600;
        min-width: 0;
      }
      .toast code {
        flex: 1;
        font-family: var(--mono);
        font-size: 12.5px;
        color: #a8a8a8;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: all;
      }
      .toast[data-fail] code {
        white-space: pre-wrap;
      }

      .empty {
        max-width: 560px;
        margin: 18vh auto;
        padding: 24px;
        text-align: center;
        font-size: 15px;
        line-height: 1.8;
        color: var(--soft);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      @keyframes vt-out {
        to {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      @keyframes vt-in {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
      }
      @keyframes info-in {
        from {
          transform: translateX(100%);
        }
      }
      @keyframes info-out {
        to {
          transform: translateX(100%);
        }
      }
      /* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */
      ::view-transition-group(*) {
        animation-duration: var(--glide-d);
        animation-timing-function: var(--glide);
      }
      ::view-transition-old(*),
      ::view-transition-new(*) {
        height: 100%;
        object-fit: cover;
        object-position: 50% 0;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.2s;
      }
      ::view-transition-old(*):only-child {
        animation: vt-out 0.18s var(--exit) both;
      }
      ::view-transition-new(*):only-child {
        animation: vt-in 0.3s 0.08s ease-out both;
      }
      ::view-transition-new(info):only-child {
        animation: info-in var(--glide-d) var(--glide) both;
      }
      ::view-transition-old(info):only-child {
        animation: info-out 0.22s var(--exit) both;
      }
      ::view-transition-old(bar) {
        display: none;
      }
      ::view-transition-new(bar) {
        animation: none;
      }
      /* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
      html[data-vt='reshape']::view-transition-old(*) {
        animation: none;
        opacity: 0;
      }
      html[data-vt='reshape']::view-transition-new(*) {
        animation: none;
      }
      html[data-vt='reshape']::view-transition-old(*):only-child {
        animation: vt-out 0.18s var(--exit) both;
        opacity: 1;
      }
      html[data-vt='reshape']::view-transition-new(*):only-child {
        animation: vt-in 0.3s 0.08s ease-out both;
      }

      @media (max-width: 1180px) {
        .grid {
          --cols: 2 !important;
        }
        .bar {
          grid-template-columns: minmax(0, 1fr) auto;
          row-gap: 10px;
        }
        .loupe {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
      }
      @media (max-width: 760px) {
        .bar {
          grid-template-columns: 1fr;
          padding: 10px 16px;
        }
        .bar-c .seg {
          min-width: 0;
        }
        .bar-c .seg button {
          padding-inline: 9px;
        }
        .bar-c {
          flex-wrap: wrap;
        }
        .intro {
          padding: 24px 16px 0;
        }
        .grid {
          --cols: 1 !important;
          padding: 24px 16px 48px;
          gap: 48px;
        }
        .loupe {
          position: static;
          display: flex;
          flex-direction: column;
        }
        .surface {
          flex: none;
        }
        .track {
          height: auto;
          align-items: flex-start;
        }
        .slide {
          height: auto;
          padding: 16px 12px;
        }
        .info {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        .film {
          display: flex;
          overflow-x: auto;
        }
        .film button {
          flex: none;
        }
        .info-body {
          padding: 20px 16px;
        }
        .nav {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
          animation-duration: 0s !important;
          animation-delay: 0s !important;
        }
        .frame:hover {
          transform: none;
        }
      }
    </style>
  </head>

          else if (e.key === 'ArrowRight') step(1)
          else if (e.key === 'Escape') setLayout('compare')
          else if (e.key.toLowerCase() === 'p') choose(st.current)
        })
        function syncBars() {
          root.style.setProperty('--bar-h', `${$('#bar').offsetHeight}px`)
          placeThumbs(true)
          placeFilm(true)
          refit()
        }
        window.addEventListener('resize', syncBars, { passive: true })
        document.fonts?.ready.then(() => {
          placeThumbs(true)
          placeFilm(true)
        })
        $('#bar').hidden = false
        if (st.layout === 'compare') {
          $('#grid').classList.add('first')
          $('.intro').classList.add('first')
          setTimeout(() => {
            $('#grid').classList.remove('first')
            $('.intro').classList.remove('first')
          }, 1400)
        }
        render()
        syncBars()
        if (services.size) {
          checkServices()
          setInterval(() => {
            if (!document.hidden) checkServices()
          }, 5000)
          window.addEventListener('focus', checkServices)
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkServices()
          })
        }
      })()
    </script>
  </body>
</html>

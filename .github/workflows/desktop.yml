name: Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xdotool python3-pil
          cargo install tauri-driver --locked --version 2.1.0
          # Headless runners register a desktop portal that cannot start. WebKit and
          # tao otherwise wait about 30 seconds for its D-Bus activation to time out.
          # Match Tauri's own CI setup; this affects only the disposable runner.
          repeaty_portal=/usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service
          if [ -f "$repeaty_portal" ]; then sudo mv "$repeaty_portal" "$repeaty_portal.disabled"; fi
      - name: Check desktop frontend and local plugin
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npx vitest run --mode desktop src/plugins/plugins.test.ts src/plugins/frontend-example.test.ts
          npm run test:e2e:desktop
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path crates/leetcode-local/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/leetcode-local/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check Windows credentials and upstream isolation
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo clippy --manifest-path crates/leetcode-local/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/leetcode-local/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked upstream::tests
      - name: Build installer
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Exercise MCP stdio without a graphical session
        run: node scripts/test-mcp-stdio.mjs
      - name: Exercise native WebKit and Rust IPC
        if: runner.os == 'Linux'
        env:
          REPEATY_DESKTOP_BINARY: src-tauri/target/release/repeaty-desktop
          REPEATY_EXPECT_BUNDLED: '1'
          REPEATY_CAPTURE_NATIVE_SCREEN: '1'
        run: |
          npm run build:server
          cargo build --locked --manifest-path server/Cargo.toml
          xvfb-run -a node scripts/test-desktop-native.mjs
          GSETTINGS_BACKEND=memory GTK_USE_PORTAL=0 GIO_USE_VFS=local dbus-run-session --config-file=scripts/fixtures/minimal-desktop-session.conf -- xvfb-run -a node scripts/test-workspace-preview-native.mjs
      - name: Upload workspace preview screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-preview-screenshots
          path: test-results/workspace-preview-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repeaty-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-report
          path: |
            playwright-report-desktop/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: github.repository == 'KraHsu/repeaty' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    concurrency:
      group: repeaty-release
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Verify this commit and wait for core checks
        id: release
        run: node scripts/release.mjs prepare "$RUNNER_TEMP/repeaty-release-plan.json"
      - name: Download the tested installers
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.release.outputs.artifact_ids }}
          path: release-installers
      - name: Publish installers and checksums
        if: steps.release.outputs.publish == 'true'
        run: node scripts/release.mjs publish "$RUNNER_TEMP/repeaty-release-plan.json" release-installers

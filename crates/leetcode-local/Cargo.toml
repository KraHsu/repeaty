[package]
name = "repeaty-leetcode-local"
version = "0.26.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3"

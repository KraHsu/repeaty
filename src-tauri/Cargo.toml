[package]
name = "repeaty-desktop"
version = "0.27.0"
edition = "2024"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8.9"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest", "transport-io"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
base64 = "0.22"
open = "5"
tauri-plugin-dialog = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
repeaty-workspace = { path = "../crates/workspace-store" }
cap-std = "4.0.3"
cap-primitives = "4.0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
